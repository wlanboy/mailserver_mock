apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploymentName }}
        sidecar.istio.io/inject: "true"
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.deploymentName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SMTP_HOST
              value: "0.0.0.0"
            - name: SMTP_PORT
              value: {{ .Values.service.smtp.targetPort | quote }}
            - name: IMAP_HOST
              value: "0.0.0.0"
            - name: IMAP_PORT
              value: {{ .Values.service.imap.targetPort | quote }}
            - name: HTTP_HOST
              value: "0.0.0.0"
            - name: HTTP_PORT
              value: {{ .Values.service.http.targetPort | quote }}
            - name: MAIL_DIR
              value: {{ .Values.env.mailDir | quote }}
            - name: USERS_FILE
              {{- if .Values.users.configMap.enabled }}
              value: {{ printf "%s/users.json" (trimSuffix "/" .Values.users.mountPath) | quote }}
              {{- else }}
              value: {{ .Values.env.usersFile | quote }}
              {{- end }}
          ports:
            - name: smtp
              containerPort: {{ .Values.service.smtp.targetPort }}
            - name: imap
              containerPort: {{ .Values.service.imap.targetPort }}
            - name: http
              containerPort: {{ .Values.service.http.targetPort }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: mails
              mountPath: {{ .Values.volume.mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.users.configMap.enabled }}
            # Kein subPath, sonst würden ConfigMap-Updates nicht in den Pod propagiert
            - name: users
              mountPath: {{ .Values.users.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- if .Values.users.configMap.enabled }}
        - name: users
          configMap:
            name: {{ .Values.users.configMap.name }}
        {{- end }}
        - name: mails
          {{- if .Values.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
