{{- if .Values.users.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.users.configMap.name }}
data:
  users.json: |-
    {{- if .Values.users.json }}
    {{- .Values.users.json | nindent 4 }}
    {{- else }}
    {{- toPrettyJson .Values.users.config | nindent 4 }}
    {{- end }}
{{- end }}
